<svg xmlns="http://www.w3.org/2000/svg" width="640" height="544" viewBox="0 0 640 544" role="img" aria-labelledby="title desc"><title id="title">04 / DESIGNING FOR CHANGE</title><desc id="desc">Reusability, automated testing, feature toggles, maintainability and collaboration support software that can change.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#708696"/></marker></defs><rect width="640" height="544" fill="#f8fafb"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="14" fill="#526f85" text-anchor="start" font-weight="600">04 / DESIGNING FOR CHANGE</text><rect x="32" y="78" width="252" height="58" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="158.0" y="113.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Reusability</text><path d="M284 107 H334" fill="none" stroke="#708696" stroke-width="1.5" /><rect x="32" y="160" width="252" height="58" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="158.0" y="195.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Automated testing</text><path d="M284 189 H334" fill="none" stroke="#708696" stroke-width="1.5" /><rect x="32" y="242" width="252" height="58" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="158.0" y="277.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Feature toggles</text><path d="M284 271 H334" fill="none" stroke="#708696" stroke-width="1.5" /><rect x="32" y="324" width="252" height="58" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="158.0" y="359.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Maintainability</text><path d="M284 353 H334" fill="none" stroke="#708696" stroke-width="1.5" /><rect x="32" y="406" width="252" height="58" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="158.0" y="441.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Collaboration</text><path d="M284 435 H334" fill="none" stroke="#708696" stroke-width="1.5" /><path d="M334 107 V435" fill="none" stroke="#708696" stroke-width="1.5" /><path d="M334 271 H376" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="386" y="215" width="222" height="112" rx="6" fill="#eef3f7" stroke="#526f85"/><text x="497.0" y="266.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Software that</text><text x="497.0" y="293.0" font-size="15" fill="#5e6e7a" text-anchor="middle" font-weight="400">can change</text><text x="320" y="512" font-size="15" fill="#5e6e7a" text-anchor="middle" font-weight="400">Engineering practices that support long-term change</text></g></svg>
