<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title desc"><title id="title">03 / EVALUATING THE COST OF CONSISTENCY</title><desc id="desc">The internal approach accumulates workarounds. A considered external-library exception enables the required button hover tooltip interaction.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#708696"/></marker></defs><rect width="640" height="690" fill="#f8fafb"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="14" fill="#526f85" text-anchor="start" font-weight="600">03 / EVALUATING THE COST OF CONSISTENCY</text><text x="32" y="83" font-size="14" fill="#526f85" text-anchor="start" font-weight="600">INTERNAL APPROACH</text><rect x="80" y="106" width="480" height="64" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="320.0" y="144.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Existing button</text><path d="M320 170 V202" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="80" y="210" width="480" height="64" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="320.0" y="248.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Workaround</text><path d="M320 274 V306" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="80" y="314" width="480" height="64" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="320.0" y="352.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Additional workaround</text><text x="320" y="411" font-size="16" fill="#805968" text-anchor="middle" font-weight="400">More complexity; intended interaction still unresolved</text><path d="M32 440 H608" stroke="#d9e1e7"/><text x="32" y="479" font-size="14" fill="#526f85" text-anchor="start" font-weight="600">CONSIDERED EXCEPTION</text><rect x="32" y="514" width="210" height="72" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="137.0" y="556.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Button</text><path d="M242 550 H390" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><text x="320" y="530" font-size="15" fill="#5e6e7a" text-anchor="middle" font-weight="400">hover</text><rect x="398" y="514" width="210" height="72" rx="6" fill="#eef3f7" stroke="#526f85"/><text x="503.0" y="556.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Tooltip</text><text x="320" y="621" font-size="16" fill="#526f85" text-anchor="middle" font-weight="400">External library supports the intended interaction</text><text x="320" y="660" font-size="14" fill="#5e6e7a" text-anchor="middle" font-weight="400">A local tradeoff, assessed together with a mentor</text></g></svg>
