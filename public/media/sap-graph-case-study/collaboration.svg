<svg xmlns="http://www.w3.org/2000/svg" width="640" height="738" viewBox="0 0 640 738" role="img" aria-labelledby="title desc"><title id="title">01 / FROM INDIVIDUAL WORK TO A SHARED SYSTEM</title><desc id="desc">University projects lead into SAP Graph, where design, engineering and product contribute to a shared system and release.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#708696"/></marker></defs><rect width="640" height="738" fill="#f8fafb"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="14" fill="#526f85" text-anchor="start" font-weight="600">01 / FROM INDIVIDUAL WORK TO A SHARED SYSTEM</text><rect x="150" y="72" width="340" height="80" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="320.0" y="107.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">University projects</text><text x="320.0" y="134.0" font-size="15" fill="#5e6e7a" text-anchor="middle" font-weight="400">Individual, end-to-end understanding</text><path d="M320 152 V202" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="150" y="214" width="340" height="66" rx="6" fill="#eef3f7" stroke="#526f85"/><text x="320.0" y="253.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">SAP Graph</text><path d="M320 280 V312 H110 V342" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M320 312 V342" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M320 312 H530 V342" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="350" width="172" height="62" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="110.0" y="387.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Design</text><rect x="234" y="350" width="172" height="62" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="320.0" y="38