<svg xmlns="http://www.w3.org/2000/svg" width="640" height="636" viewBox="0 0 640 636" role="img" aria-labelledby="title desc"><title id="title">02 / BUILDING ON THE DESIGN SYSTEM</title><desc id="desc">Existing primitives are wrapped with behaviour, composed into reusable product components, then assembled into an interface.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#708696"/></marker></defs><rect width="640" height="636" fill="#f8fafb"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="40" font-size="14" fill="#526f85" text-anchor="start" font-weight="600">02 / BUILDING ON THE DESIGN SYSTEM</text><text x="62" y="123" font-size="14" fill="#526f85" text-anchor="middle" font-weight="400">01</text><rect x="108" y="76" width="488" height="90" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="352.0" y="116.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Fiori / UI5 primitive</text><text x="352.0" y="143.0" font-size="15" fill="#5e6e7a" text-anchor="middle" font-weight="400">Existing building block</text><path d="M352 166 V202" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><text x="62" y="257" font-size="14" fill="#526f85" text-anchor="middle" font-weight="400">02</text><rect x="108" y="210" width="488" height="90" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="352.0" y="250.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Wrapper</text><text x="352.0" y="277.0" font-size="15" fill="#5e6e7a" text-anchor="middle" font-weight="400">Component + additional behaviour</text><path d="M352 300 V336" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><text x="62" y="391" font-size="14" fill="#526f85" text-anchor="middle" font-weight="400">03</text><rect x="108" y="344" width="488" height="90" rx="6" fill="#eef3f7" stroke="#526f85"/><text x="352.0" y="384.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Product component</text><text x="352.0" y="411.0" font-size="15" fill="#5e6e7a" text-anchor="middle" font-weight="400">Reusable composition for the product</text><path d="M352 434 V470" fill="none" stroke="#708696" stroke-width="1.5" marker-end="url(#arrow)"/><text x="62" y="525" font-size="14" fill="#526f85" text-anchor="middle" font-weight="400">04</text><rect x="108" y="478" width="488" height="90" rx="6" fill="#ffffff" stroke="#b9c5ce"/><text x="352.0" y="518.0" font-size="19" fill="#26333d" text-anchor="middle" font-weight="600">Interface</text><text x="352.0" y="545.0" font-size="15" fill="#5e6e7a" text-anchor="middle" font-weight="400">Components assembled into an experience</text><text x="320" y="608" font-size="14" fill="#5e6e7a" text-anchor="middle" font-weight="400">Conceptual composition · increasing product specificity</text></g></svg>
